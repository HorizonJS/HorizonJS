name: Main-CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Test native build and docs tools
        run: go test ./...
      - name: Vet Go code
        run: go vet ./...
      - name: Build website with native tools
        run: go run ./cmd/horizon build --tag main --docs go
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
