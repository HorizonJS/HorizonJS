name: Tag-CI

on:
  push:
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Test native build and docs tools
        run: go test ./...
      - name: Vet Go code
        run: go vet ./...
      - name: Build release with native tools
        run: go run ./cmd/horizon build --tag "$GITHUB_REF_NAME" --docs go
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./build/zips/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./build/zips/*.zip \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
